name: Отчёт на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Выпуск и слепая проверка
        run: |
          python -m pipeline.run
          python -m verifier.recompute
      - name: Перевыпуск и его слепая проверка
        run: |
          python -m pipeline.run --data data/reissue --previous output --out output-v2
          python -m verifier.recompute --data data/reissue --out output-v2 --previous output --previous-data data
      - name: Стресс-тест слепой проверки
        run: python -m stress.run --n 200 --seed 42 --out output-stress
      - name: Страница
        run: |
          mkdir -p site/reissue
          cp output/index.html output/report.xlsx output/registry.csv output/manifest.json output/controls.md output/verification.md site/
          cp output-v2/index.html output-v2/report.xlsx output-v2/registry.csv output-v2/manifest.json output-v2/controls.md output-v2/verification.md site/reissue/
          cp output-stress/stress-test.html output-stress/stress-results.csv output-stress/stress-results.json site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
