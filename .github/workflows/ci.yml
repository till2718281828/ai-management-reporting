name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: LibreOffice для пересчёта Excel-книги в тестах
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc
      - run: pip install -r requirements.txt
      - name: Тесты
        run: python -m pytest -q
      - name: Выпуск
        run: python -m pipeline.run
      - name: Слепая проверка выпуска
        run: python -m verifier.recompute
      - name: Внесённая ошибка должна быть поймана
        run: |
          python -m pipeline.run --inject-error --out output-broken
          if python -m verifier.recompute --out output-broken; then
            echo "Проверка не поймала внесённую ошибку" && exit 1
          fi
      - name: Перевыпуск — выпуск 2 против отправленного выпуска 1
        run: python -m pipeline.run --data data/reissue --previous output --out output-v2
      - name: Слепая проверка перевыпуска
        run: python -m verifier.recompute --data data/reissue --out output-v2 --previous output --previous-data data
      - name: Изменение без причины должно остановить перевыпуск
        run: |
          cp -r data/reissue reissue-no-reason
          grep -v '^Энергия,' data/reissue/reissue_reasons.csv > reissue-no-reason/reissue_reasons.csv
          if python -m pipeline.run --data reissue-no-reason --previous output --out output-no-reason; then
            echo "Перевыпуск прошёл без причины изменения" && exit 1
          fi
      - name: Стресс-тест слепой проверки, малая выборка
        run: python -m stress.run --n 21 --seed 42 --out output-stress
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            output/
            output-v2/
            output-stress/
