name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: LibreOffice для пересчёта Excel-книги в тестах
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc
      - run: pip install -r requirements.txt
      - name: Тесты
        run: python -m pytest -q
      - name: Выпуск
        run: python -m pipeline.run
      - name: Слепая проверка выпуска
        run: python -m verifier.recompute
      - name: Внесённая ошибка должна быть поймана
        run: |
          python -m pipeline.run --inject-error --out output-broken
          if python -m verifier.recompute --out output-broken; then
            echo "Проверка не поймала внесённую ошибку" && exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: output/
