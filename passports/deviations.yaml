# Паспорт блока отчёта. Схема и правила отбора строк — docs/passports.md.
id: deviations
title: Отклонения сверх роста выручки
where: html
marker: deviations
purpose: >-
  Показать статьи затрат, которые за нарастающий итог ушли от пропорции к выручке сильнее порога,
  и причину каждого отклонения — чтобы руководитель видел, где разбираться.
source: registry.csv; причины — data/commentary.csv (пишет экономист, в тексте причин чисел нет)
formula: >-
  Отклонение = факт статьи − база прошлого года × (выручка факта / выручка базы). Минус — расходы
  выросли быстрее выручки. Рядом — расходы за период, их изменение % и изменение выручки %.
owner: экономист по отчётности; причину по статье даёт владелец статьи затрат
controls:
  - Контроли выпуска (controls.md) пройдены — иначе отчёт не собирается
  - Каждое число блока привязано к строке реестра (data-r) и совпадает с ней по значению и формату
  - Нет причины в commentary.csv — в отчёте прямо написано «Причина не установлена»
  - Слепая проверка (verifier.recompute) пересчитывает каждое число из исходников
selection: >-
  Кандидаты — все статьи затрат за нарастающий итог к прошлому году. Показываются статьи
  с отклонением по модулю не меньше 5 млн ₽, не больше пяти, по убыванию модуля
  (DEVIATION_FLOOR_RUB и DEVIATIONS_MAX в pipeline/render_html.py). Остальные кандидаты остаются
  в реестре и проверяются, но руководителю не показываются.
filter: true
rows:
  - indicator: &cost_articles
      - Материалы
      - Персонал производства
      - Энергия
      - Ремонты
      - Прочие производственные
      - Коммерческие расходы
      - Управленческие расходы
      - Амортизация
      - Проценты
      - Прочие доходы и расходы
    measure: [отклонение сверх роста выручки]
    period: [ytd_vs_ly]
  - indicator: *cost_articles
    measure: [значение]
    period: [ytd, ytd_ly]
  - indicator: *cost_articles
    measure: [изменение %]
    period: [ytd_vs_ly]
  - indicator: [Выручка]
    measure: [изменение %]
    period: [ytd_vs_ly]
