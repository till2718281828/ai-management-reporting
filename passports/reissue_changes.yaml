# Паспорт блока отчёта. Схема и правила отбора строк — docs/passports.md.
id: reissue_changes
title: Что изменилось с прошлой отправки
where: html
marker: reissue_changes
only_on: reissue
purpose: >-
  Отчёт уже ушёл руководителю, потом в учёт попали правки. Блок показывает каждое изменившееся
  значение: было в отправленном отчёте, стало сейчас, на сколько и почему — чтобы ни одна правка
  при перевыпуске не прошла тихо.
source: >-
  «Было» — registry.csv отправленного выпуска (его SHA-256 в manifest.json); «стало» — registry.csv
  этого выпуска; причины — reissue_reasons.csv в папке данных выпуска (пишет владелец статьи,
  в тексте причин чисел нет).
formula: >-
  Изменение к отправке = стало − было. Сравнение по ключу (показатель, мера, период): ₽ — точно
  в копейках. Причина — у статьи P&L за месяц; у итогов и нарастающего итога — статьи за месяц,
  из которых они складываются.
owner: >-
  руководитель управленческой отчётности; причину по статье даёт владелец статьи (главный энергетик,
  главный механик, главный бухгалтер)
controls:
  - Перевыпуск (pipeline/reissue.py) — статья за месяц изменилась без причины, причина без изменения,
    производное число изменилось без изменения своих статей — выпуск остановлен
  - Каждое число блока привязано к строке реестра (data-r) и совпадает с ней по значению и формату
  - Слепая проверка (verifier.recompute --previous) сама находит изменения, сверяет «было» с отправленным
    реестром (и с --previous-data — с исходниками выпуска 1), «стало» — со своим пересчётом
selection: >-
  Только при перевыпуске и только изменившиеся значения: сначала статьи за месяц с причиной, затем
  итоги и нарастающие итоги. Неизменившиеся значения остаются в других блоках.
filter: true
rows:
  - indicator: '*'
    measure: [было при отправке, изменение к отправке]
    period: [months, ytd, ytd_ly]
  - indicator: '*'
    measure: [значение]
    period: [months, ytd, ytd_ly]
