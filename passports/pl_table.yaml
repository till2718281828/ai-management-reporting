# Паспорт блока отчёта. Схема и правила отбора строк — docs/passports.md.
id: pl_table
title: Таблица P&L
where: html
marker: pl_table
purpose: >-
  Полный управленческий P&L от выручки до чистой прибыли: нарастающий итог и отчётный месяц против
  прошлого года — для того, кто хочет проверить картину по каждой строке.
source: registry.csv (строки из journal.csv × mapping.csv и расчёты из значений реестра)
formula: >-
  Статья — сумма ног проводок, которые маппинг назначил статье; итог — сумма статей выше него.
  Δ — факт − база; Δ % — (факт − база) / |база| × 100, при нулевой базе — прочерк.
owner: руководитель управленческой отчётности
controls:
  - Контроли выпуска (controls.md) — счета в плане счетов, все ноги разнесены, счета 20/26/44/90/91
    закрыты, сверка с главной книгой, УУ = БУ
  - Каждое число блока привязано к строке реестра (data-r) и совпадает с ней по значению и формату
  - Слепая проверка (verifier.recompute) пересчитывает каждое число из исходников
selection: Все 17 строк P&L, семь колонок — без отбора по значению.
rows:
  - indicator: '*'
    measure: [значение]
    period: [ytd_ly, ytd, month_ly, month]
  - indicator: '*'
    measure: [изменение]
    period: [ytd_vs_ly]
  - indicator: '*'
    measure: [изменение %]
    period: [ytd_vs_ly, month_vs_ly]
