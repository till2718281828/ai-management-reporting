# Паспорт блока отчёта. Схема и правила отбора строк — docs/passports.md.
id: xlsx_reissue_changes
title: Книга Excel, лист «Изменения»
where: xlsx
marker: Изменения
only_on: reissue
purpose: >-
  Те же изменения, что в блоке отчёта «Что изменилось с прошлой отправки», в рублях с копейками —
  для экономиста, который сверяет перевыпуск с учётом.
source: registry.csv этого выпуска (строки «значение», «было при отправке», «изменение к отправке»); причины — reissue_reasons.csv
formula: >-
  Было, стало и изменение — числа из реестра, не формулы; в последней колонке — id строк реестра,
  из которых они взяты.
owner: экономист по отчётности; причину по статье даёт владелец статьи
controls:
  - Перевыпуск (pipeline/reissue.py) — изменение без причины или причина без изменения останавливают выпуск
  - Тест паспортов сверяет числа листа со строками реестра по id
selection: Только при перевыпуске и только изменившиеся значения — как в блоке отчёта.
filter: true
rows:
  - indicator: '*'
    measure: [было при отправке, изменение к отправке]
    period: [months, ytd, ytd_ly]
  - indicator: '*'
    measure: [значение]
    period: [months, ytd, ytd_ly]
