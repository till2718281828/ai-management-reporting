# Паспорт блока отчёта. Схема и правила отбора строк — docs/passports.md.
id: kpi_tiles
title: Карточки ключевых показателей
where: html
marker: kpi_tiles
purpose: >-
  Первый экран отчёта: за несколько секунд показать руководителю выручку, EBITDA и чистую прибыль
  за нарастающий итог и отчётный месяц, их изменение к прошлому году и рентабельность.
source: registry.csv (строки из journal.csv × mapping.csv и расчёты из значений реестра)
formula: >-
  Значение — сумма строки управленческого P&L за период; изменение % — (факт − база) / |база| × 100;
  рентабельность % — строка / выручка × 100. Блок ничего не считает, только выбирает строки реестра.
owner: руководитель управленческой отчётности
controls:
  - Контроли выпуска (controls.md) пройдены — иначе отчёт не собирается
  - Каждое число блока привязано к строке реестра (data-r) и совпадает с ней по значению и формату
  - Слепая проверка (verifier.recompute) пересчитывает каждое число из исходников
selection: Шесть карточек — фиксированный набор строк, без отбора по значению.
rows:
  - indicator: [Выручка, EBITDA, Чистая прибыль]
    measure: [значение]
    period: [ytd]
  - indicator: [Выручка, EBITDA, Чистая прибыль]
    measure: [изменение %]
    period: [ytd_vs_ly]
  - indicator: [EBITDA, Чистая прибыль]
    measure: [рентабельность %]
    period: [ytd]
  - indicator: [Чистая прибыль]
    measure: [рентабельность %]
    period: [ytd_ly]
  - indicator: [Выручка, Чистая прибыль]
    measure: [значение]
    period: [month]
  - indicator: [Выручка, Чистая прибыль]
    measure: [изменение %]
    period: [month_vs_ly]
