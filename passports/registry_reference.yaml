# Паспорт блока отчёта. Схема и правила отбора строк — docs/passports.md.
id: registry_reference
title: Справочные строки реестра
where: registry
marker: registry.csv
purpose: >-
  Числа, которые конвейер считает для полноты сравнения, но в отчёт руководителю не выводит:
  их можно открыть в registry.csv (публикуется рядом с отчётом) и сверить при разборе вопросов.
source: registry.csv (расчёт из значений реестра)
formula: >-
  Изменение — факт − база; рентабельность % — строка / выручка × 100; отклонение сверх роста выручки —
  факт − база × (выручка факта / выручка базы). Методика — docs/methodology.md.
owner: владелец конвейера отчётности
controls:
  - Слепая проверка (verifier.recompute) пересчитывает каждую строку реестра из исходников
  - Тест паспортов — ни одна строка этого паспорта не выведена в отчёт (иначе её место в паспорте блока)
selection: >-
  Изменение в рублях за отчётный месяц; отклонения сверх роста выручки за отчётный месяц;
  рентабельность, которой нет в карточках.
rows:
  - indicator: '*'
    measure: [изменение]
    period: [month_vs_ly]
  - indicator: '*'
    measure: [отклонение сверх роста выручки]
    period: [month_vs_ly]
  - indicator: [Валовая прибыль, Прибыль от продаж]
    measure: [рентабельность %]
    period: [month, month_ly, ytd, ytd_ly]
  - indicator: [EBITDA]
    measure: [рентабельность %]
    period: [month, month_ly, ytd_ly]
  - indicator: [Чистая прибыль]
    measure: [рентабельность %]
    period: [month, month_ly]
