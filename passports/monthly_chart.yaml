# Паспорт блока отчёта. Схема и правила отбора строк — docs/passports.md.
id: monthly_chart
title: Помесячная динамика
where: html
marker: monthly_chart
purpose: >-
  Показать форму года: сезонность выручки и чистой прибыли по месяцам за два года — без чисел,
  только столбики и линия.
source: registry.csv (значения строк по месяцам)
formula: >-
  Столбик — выручка месяца, линия — чистая прибыль месяца в масштабе ×4. Подписей-чисел нет,
  поэтому привязок data-r в блоке нет; строки реестра, по которым построен график, перечислены
  в атрибуте data-rows (в реестре у них shown_in = chart).
owner: руководитель управленческой отчётности
controls:
  - Контроли выпуска (controls.md) пройдены — иначе отчёт не собирается
  - Помесячные значения те же, что в листе «P&L» книги; книга сходится с реестром до копейки (тест)
selection: Все месяцы реестра, две строки — без отбора по значению.
rows:
  - indicator: [Выручка, Чистая прибыль]
    measure: [значение]
    period: [months]
