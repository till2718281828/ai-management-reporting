# Паспорт блока отчёта. Схема и правила отбора строк — docs/passports.md.
id: xlsx_pl
title: Помесячная книга Excel, лист «P&L»
where: xlsx
marker: P&L
purpose: >-
  Помесячный P&L, который финансист может пересчитать сам: поменять правило в листе «Маппинг»
  и увидеть, как изменится результат.
source: report.xlsx — формулы поверх листов «Ноги», «Проводки» (journal.csv) и «Маппинг» (mapping.csv)
formula: >-
  Ячейка статьи — SUMIFS по листу «Ноги» (статья и месяц); итог — сумма статей выше него.
  Книга считает сама и не берёт числа из реестра; совпадение с реестром проверяется.
owner: экономист по отчётности
controls:
  - Контроли выпуска (controls.md) пройдены — иначе книга не собирается
  - Тест пересчитывает книгу LibreOffice и сверяет каждую ячейку P&L с реестром до копейки
  - Тексты из данных, начинающиеся с «=», пишутся строкой, а не формулой (защита от формул-инъекций)
selection: Все строки P&L за все месяцы реестра — без отбора по значению.
rows:
  - indicator: '*'
    measure: [значение]
    period: [months]
